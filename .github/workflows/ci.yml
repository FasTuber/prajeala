name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'

jobs:
  check:
    name: Typecheck, lint, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Icons are up to date
        run: node scripts/gen-icons.mjs --check

      - name: Install Electron runtime libraries + Xvfb
        # Ubuntu 24.04 renamed several libs with a "t64" suffix and dropped the
        # old names, so try the new name first and fall back to the old one.
        run: |
          sudo apt-get update -qq
          for pkg in xvfb libnss3 libxss1 libgbm1 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
                     "libgtk-3-0t64 libgtk-3-0" "libasound2t64 libasound2" \
                     "libatk-bridge2.0-0t64 libatk-bridge2.0-0" "libcups2t64 libcups2"; do
            for candidate in $pkg; do
              if sudo apt-get install -y -qq --no-install-recommends "$candidate"; then break; fi
            done
          done

      - name: Smoke test (Xvfb, software GL)
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: npm run smoke

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.json
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Unsigned builds: do not look for a signing identity on macOS.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build installers
        run: npx electron-builder --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: prajeala-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft GitHub release
    # Tags only: collects the installers of every OS into a *draft* release, so
    # nothing is public until you press “Publish” on GitHub.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prajeala-*
          path: installers
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(installers/*.exe installers/*.dmg installers/*.zip installers/*.AppImage installers/*.deb installers/*.blockmap installers/latest*.yml)
          printf '%s\n' "${files[@]}"
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Prăjeală $TAG" \
            --generate-notes
