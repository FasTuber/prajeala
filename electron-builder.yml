# electron-builder configuration — `npm run dist` (installers) / `npm run pack` (unpacked dir).
# Icons come from `npm run icons` (assets/icon.png is converted to .ico/.icns at build time).
appId: ro.codulzilei.prajeala
productName: Prajeala
copyright: Copyright © 2026 Mihai Balan (FasTuber)
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: assets

files:
  - dist/**
  - assets/**
  - package.json

# Native optional modules must stay on disk (not inside the asar) to be loadable.
asar: true
asarUnpack:
  - node_modules/uiohook-napi/**
  - node_modules/get-windows/**

# Both native modules ship prebuilt binaries; never rebuild against Electron headers on the build box.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: assets/icon.png
  category: public.app-category.entertainment
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
  extendInfo:
    # Tray-only app: no Dock icon, no app switcher entry.
    LSUIElement: true
    NSHumanReadableCopyright: Copyright © 2026 Mihai Balan (FasTuber)

dmg:
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: assets/icon.png
  category: Utility
  synopsis: Interactive fire overlay for the desktop, apps and cursor
  description: Transparent, click-through overlay that draws a GPU fluid-simulated fire on every screen, around the focused window and around the mouse cursor.
  maintainer: FasTuber <fastuber@users.noreply.github.com>
  desktop:
    entry:
      StartupNotify: 'false'
      Keywords: fire;flames;overlay;cursor;fun;

deb:
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
