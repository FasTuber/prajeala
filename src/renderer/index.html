<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Prăjeală overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
        user-select: none;
      }
      canvas#fire {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="fire"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
